services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: isur_productos
      POSTGRES_USER: isur_user
      POSTGRES_PASSWORD: isur_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isur_user -d isur_productos"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: isur_productos
      DB_USER: isur_user
      DB_PASSWORD: isur_password
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
